<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이미지 번역</title>
<style>
  :root{--bg:#0c0b0a;--panel:#151312;--panel2:#1c1a18;--line:#2a2725;--line2:#3a3633;
    --ink:#f5f2ee;--sub:#c2bbb3;--dim:#948d85;--acc:#e8a54b;--acc2:#f3c27a;--ok:#5fbf8a;--bad:#ef6b5f}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:16px/1.55 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:22px 28px 60px}
  a{color:var(--acc2)}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;color:#1a120a;font-weight:900}
  h1{font-size:22px;margin:0} header small{color:var(--dim)} header .back{margin-left:auto;font-size:15px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
  #drop{border:1.5px dashed var(--line2);border-radius:14px;padding:46px 16px;text-align:center;cursor:pointer;transition:.2s;color:var(--sub)}
  #drop:hover,#drop.on{border-color:var(--acc);background:rgba(232,165,75,.07)}
  #drop b{color:var(--ink);font-size:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  button{font:inherit;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:9px 16px;cursor:pointer}
  button.main{background:var(--acc);color:#1a120a;border-color:var(--acc);font-weight:700}
  button:disabled{opacity:.45;cursor:default}
  .bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:12px} .bar i{display:block;height:100%;width:0;background:var(--acc);transition:.3s}
  #msg{color:var(--sub);margin-top:8px;min-height:24px} .bad{color:var(--bad)!important}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
  .card h3{margin:0 0 12px;font-size:17px;display:flex;gap:10px;align-items:center} .card h3 .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pics{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pic{position:relative;background:#000;border-radius:10px;overflow:hidden}
  .pic img{width:100%;display:block}
  .pic .lab{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);padding:2px 9px;border-radius:6px;font-size:13px;color:var(--acc2)}
  .hl{position:absolute;border:2px solid var(--acc);border-radius:4px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;display:none}
  table{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px}
  td,th{padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle;text-align:left}
  th{color:var(--dim);font-weight:500;font-size:13px}
  td.src{color:var(--sub);max-width:220px}
  input[type=text]{width:100%;font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink)}
  input[type=color]{width:34px;height:28px;border:none;background:none;padding:0;cursor:pointer;vertical-align:middle}
  select{font:inherit;padding:5px 6px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink)}
  label.ck{display:inline-flex;gap:4px;align-items:center;font-size:14px;color:var(--sub);white-space:nowrap}
  .muted{color:var(--dim);font-size:14px}
  .ov{position:absolute;inset:0;pointer-events:none}
  .bx{position:absolute;border:1.5px dashed rgba(243,194,122,.0);border-radius:3px;pointer-events:auto;cursor:move;touch-action:none}
  .pic:hover .bx{border-color:rgba(243,194,122,.75)}
  .bx.sel{border:2px solid var(--acc)!important;background:rgba(232,165,75,.08)}
  .bx i{position:absolute;width:12px;height:12px;background:var(--acc);border:2px solid #1a120a;border-radius:3px;display:none}
  .bx.sel i{display:block}
  .bx i.tl{left:-7px;top:-7px;cursor:nwse-resize}.bx i.tr{right:-7px;top:-7px;cursor:nesw-resize}
  .bx i.bl{left:-7px;bottom:-7px;cursor:nesw-resize}.bx i.br{right:-7px;bottom:-7px;cursor:nwse-resize}
  tr.sel td{background:rgba(232,165,75,.09)}
  .ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .ctl .g{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--dim);white-space:nowrap}
  button.eye{padding:2px 6px;font-size:13px;border-radius:7px;line-height:1.2}
  input[type=range]{width:70px;accent-color:var(--acc);vertical-align:middle}
  input[type=number]{width:64px;font:inherit;padding:5px 6px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink)}
  select.fn{max-width:190px}
  .tip{color:var(--dim);font-size:13px;margin-top:8px}
  .busy{opacity:.55;transition:opacity .2s}
  @media (max-width:900px){.pics{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="mark">가</div><div><h1>이미지 번역</h1><small>상품·광고 이미지 속 일본어·중국어 → 한국어 (가로는 가로, 세로는 세로 그대로)</small></div>
</header>

<div class="panel">
  <div id="drop"><b>이미지를 끌어다 놓거나 눌러서 고르기</b><br>여러 장 한 번에 · png, jpg, webp</div>
  <input id="file" type="file" accept=".png,.jpg,.jpeg,.webp,.bmp" multiple hidden>
  <div class="row"><button id="go" class="main" disabled>번역 시작</button><span id="picked" class="muted"></span>
    <button id="zip" style="margin-left:auto;display:none">결과 모두 받기 (zip)</button></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="msg">처음 한 번은 글자 지우기 모델과 번역 모델을 받느라 오래 걸려요. 다음부터는 바로 시작해요.</div>
</div>
<div id="list"></div>

<script>
const $ = id => document.getElementById(id);
let files = [], cur = null, shown = {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hex = c => c ? "#" + c.map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, "0")).join("") : "#ffffff";
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function pick(fs) {
  files = [...fs].filter(f => /\.(png|jpe?g|webp|bmp)$/i.test(f.name));
  $("picked").textContent = files.length ? `${files.length}장 골랐어요` : "";
  $("go").disabled = !files.length;
}
$("drop").onclick = () => $("file").click();
$("file").onchange = e => pick(e.target.files);
["dragover", "dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("on"); }));
["dragleave", "drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("on"); }));
$("drop").addEventListener("drop", e => pick(e.dataTransfer.files));
$("go").onclick = () => {
  const fd = new FormData(); files.forEach(f => fd.append("files", f, f.name));
  $("go").disabled = true; $("list").innerHTML = ""; shown = {}; $("zip").style.display = "none";
  $("msg").textContent = "올리는 중…"; $("msg").classList.remove("bad");
  fetch("/imgtr/run", { method: "POST", body: fd }).then(r => r.json()).then(r => {
    if (r.error) { $("msg").textContent = r.error; $("msg").classList.add("bad"); $("go").disabled = false; return; }
    cur = r.id; try { localStorage.setItem("imgtr_last", cur); } catch (e) {} poll();
  });
};
$("zip").onclick = () => { if (cur) location.href = `/imgtr/zip/${cur}`; };
function poll() {
  fetch(`/imgtr/state/${cur}`).then(r => r.json()).then(s => {
    if (s.error && !s.files) return;
    $("bar").style.width = (s.pct || 0) + "%";
    $("msg").textContent = s.error ? "문제가 생겼어요: " + s.error : s.msg; $("msg").classList.toggle("bad", !!s.error);
    (s.done || []).forEach(n => { if (!shown[n]) { shown[n] = true; card(n, s.blocks[n] || []); } });
    if (s.done && s.done.length) $("zip").style.display = "";
    if (s.running) setTimeout(poll, 1200); else $("go").disabled = !files.length;
  }).catch(() => setTimeout(poll, 3000));
}
// 이 PC 글꼴 목록 (한글 되는 것만)
let FONTS = [], fontWait = [];
function loadFonts() {
  fetch("/imgtr/fonts").then(r => r.json()).then(f => {
    FONTS = f.list || [];
    fontWait.forEach(fn => fn()); 
    if (f.scanning) setTimeout(loadFonts, 2500);
  }).catch(() => setTimeout(loadFonts, 4000));
}
loadFonts();
const fontOpts = cur => `<option value="">기본 고딕 (본고딕)</option><option value="@serif" ${cur === "@serif" ? "selected" : ""}>기본 명조 (본명조)</option>` + FONTS.map(f => `<option value="${esc(f.id)}" ${f.id === cur ? "selected" : ""}>${esc(f.name)}</option>`).join("")
  + (cur && cur !== "@serif" && !FONTS.some(f => f.id === cur) ? `<option value="${esc(cur)}" selected>${esc(cur.split(/[\\/]/).pop().split("|")[0])}</option>` : "");
// 외부 광선 기본색: 글자가 어두우면 흰색, 밝으면 검정
const glowDefault = s => { const c = s.fill || [0, 0, 0]; return (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) < 128 ? [255, 255, 255] : [0, 0, 0]; };
// 스포이드: 화면 어디서든 (원본 그림 등) 색을 찍어 옴 — 크롬·엣지에서 됨
const EYE = cls => window.EyeDropper ? `<button class="eye" data-for="${cls}" title="스포이드 — 화면에서 색 찍기">💧</button>` : "";
const WT = { 400: "보통", 500: "중간", 700: "굵게", 900: "아주 굵게" };
const OW = [[0.05, "얇게"], [0.09, "보통"], [0.15, "두껍게"], [0.22, "아주 두껍게"]];

function card(n, bl) {
  const el = document.createElement("div"); el.className = "card";
  const u = encodeURIComponent(n);
  const rows = bl.map((b, i) => { const s = b.style; const ow = s.ow || 0.09; return `<tr data-i="${i}">
    <td class="src">${b.vert ? "<span class='muted'>세로</span> " : ""}${esc(b.text)}</td>
    <td style="width:26%"><input type="text" class="ko" value="${esc(b.ko)}"></td>
    <td><div class="ctl">
      <span class="g">글꼴 <select class="fn">${fontOpts(s.font)}</select></span>
      <span class="g">크기 <input type="number" class="sc" min="20" max="500" step="5" value="${Math.round((s.scale || 1) * 100)}">%</span>
      <span class="g">글자색 <input type="color" class="fill" value="${hex(s.grad ? s.grad[0] : s.fill)}" title="글자색${s.grad ? " (위)" : ""}">${s.grad ? `<input type="color" class="fill2" value="${hex(s.grad[1])}" title="글자색 (아래)">` : ""}${EYE("fill")}</span>
      <span class="g"><label class="ck"><input type="checkbox" class="ol" ${s.outline ? "checked" : ""}>테두리</label><input type="color" class="olc" value="${hex(s.outline || [255, 255, 255])}">${EYE("olc")}
        <select class="ow">${OW.map(([v, t]) => `<option value="${v}" ${Math.abs(v - ow) < 0.01 ? "selected" : ""}>${t}</option>`).join("")}</select></span>
      <span class="g"><label class="ck"><input type="checkbox" class="gl" ${s.glow ? "checked" : ""}>외부 광선</label><input type="color" class="glc" value="${hex(s.glow || glowDefault(s))}">${EYE("glc")}
        크기<input type="range" class="gs" min="3" max="60" value="${Math.round((s.gs || 0.15) * 100)}">
        진하기<input type="range" class="ga" min="5" max="100" value="${Math.round((s.ga ?? 0.8) * 100)}"></span>
      <span class="g">투명도<input type="range" class="op" min="5" max="100" value="${Math.round((s.op ?? 1) * 100)}"></span>
      <span class="g">굵기 <select class="wt">${[400, 500, 700, 900].map(w => `<option value="${w}" ${w == s.weight ? "selected" : ""}>${WT[w]}</option>`).join("")}</select></span>
      <label class="ck"><input type="checkbox" class="skip" ${b.skip ? "checked" : ""}>원문 그대로</label>
      <button class="rs" title="옮긴 위치·크기를 처음대로" style="padding:4px 10px">↺</button>
    </div></td></tr>`; }).join("");
  el.innerHTML = `<h3><span class="nm">${esc(n)}</span>
      ${bl.length ? `<span class="g muted" style="flex:none">모든 글씨 글꼴 <select class="fnall fn"><option value="-">— 골라서 한 번에 —</option></select></span>` : ""}
      <a href="/imgtr/img/${cur}/out/${u}" download="${esc(n)}"><button>이미지 받기</button></a></h3>
    <div class="pics"><div class="pic"><span class="lab">원본</span><img src="/imgtr/img/${cur}/in/${u}"></div>
    <div class="pic"><span class="lab">한국어</span><img class="out" draggable="false" src="/imgtr/img/${cur}/out/${u}?t=${Date.now()}"><div class="ov"></div></div></div>
    ${bl.length ? `<div class="tip">오른쪽 그림에서 글씨를 끌면 옮겨지고, 모서리 네모를 끌면 크기가 바뀌어요 · 고른 글씨는 방향키로 1칸씩 (Shift 누르면 10칸)</div>
      <table><tr><th>원문</th><th>한국어 (고쳐도 돼요)</th><th>모양</th></tr>${rows}</table>` : `<p class="muted">일본어·중국어 글자를 못 찾았어요.</p>`}`;
  $("list").appendChild(el);
  const img = el.querySelector("img.out"), ov = el.querySelector(".ov");
  const trs = [...el.querySelectorAll("tr[data-i]")];
  let sel = -1, timer = null, seq = 0;

  // 결과 그림 위 상자 (글씨 잡는 곳)
  const bxs = bl.map((b, i) => {
    const d = document.createElement("div"); d.className = "bx";
    d.innerHTML = `<i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>`;
    ov.appendChild(d); d.dataset.i = i; return d;
  });
  const ratio = () => img.naturalWidth ? img.clientWidth / img.naturalWidth : 1;
  function place(i, mv = [0, 0], k = 1) {
    const b = bl[i], r = b.drawn || b.box, q = ratio(), d = bxs[i];
    if (b.skip || !(b.ko || "").trim()) { d.style.display = "none"; return; }
    const cx = (r[0] + r[2]) / 2 * q + mv[0], cy = (r[1] + r[3]) / 2 * q + mv[1];
    const w = Math.max(14, (r[2] - r[0]) * q * k), h = Math.max(14, (r[3] - r[1]) * q * k);
    Object.assign(d.style, { display: "block", left: cx - w / 2 - 3 + "px", top: cy - h / 2 - 3 + "px", width: w + 6 + "px", height: h + 6 + "px" });
  }
  const placeAll = () => bl.forEach((_, i) => place(i));
  img.addEventListener("load", placeAll); window.addEventListener("resize", placeAll);
  function select(i) {
    sel = i;
    bxs.forEach((d, j) => d.classList.toggle("sel", j === i));
    trs.forEach((tr, j) => tr.classList.toggle("sel", j === i));
  }
  // 끌어 옮기기 / 모서리로 크기
  bxs.forEach((d, i) => d.addEventListener("pointerdown", e => {
    e.preventDefault(); select(i); d.setPointerCapture(e.pointerId);
    const b = bl[i], q = ratio(), r = b.drawn || b.box;
    const rect = ov.getBoundingClientRect();
    const c = [(r[0] + r[2]) / 2 * q + rect.left, (r[1] + r[3]) / 2 * q + rect.top];
    const corner = e.target.tagName === "I", sx = e.clientX, sy = e.clientY;
    const d0 = Math.hypot(sx - c[0], sy - c[1]) || 1;
    let mv = [0, 0], k = 1, moved = false;
    const move = ev => {
      moved = true;
      if (corner) { k = Math.max(0.15, Math.hypot(ev.clientX - c[0], ev.clientY - c[1]) / d0); place(i, [0, 0], k); }
      else { mv = [ev.clientX - sx, ev.clientY - sy]; place(i, mv, 1); }
    };
    const up = () => {
      d.removeEventListener("pointermove", move); d.removeEventListener("pointerup", up); d.removeEventListener("pointercancel", up);
      if (!moved) return;
      if (corner) {
        b.style.scale = Math.min(5, Math.max(0.2, (b.style.scale || 1) * k));
        trs[i].querySelector(".sc").value = Math.round(b.style.scale * 100);
      } else { b.style.dx = (b.style.dx || 0) + mv[0] / q; b.style.dy = (b.style.dy || 0) + mv[1] / q; }
      redraw(0);
    };
    d.addEventListener("pointermove", move); d.addEventListener("pointerup", up); d.addEventListener("pointercancel", up);
  }));
  // 방향키로 조금씩
  document.addEventListener("keydown", e => {
    if (sel < 0 || !el.isConnected || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const st = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!st) { if (e.key === "Escape") select(-1); return; }
    e.preventDefault();
    const m = e.shiftKey ? 10 : 1, b = bl[sel];
    b.style.dx = (b.style.dx || 0) + st[0] * m; b.style.dy = (b.style.dy || 0) + st[1] * m;
    if (b.drawn) b.drawn = [b.drawn[0] + st[0] * m, b.drawn[1] + st[1] * m, b.drawn[2] + st[0] * m, b.drawn[3] + st[1] * m];
    place(sel); redraw(350);
  });
  ov.parentElement.addEventListener("pointerdown", e => { if (!e.target.closest(".bx")) select(-1); });

  // 표에서 고친 것 → 바로 다시 그림
  function readRow(i) {
    const tr = trs[i], s = bl[i].style, f2 = tr.querySelector(".fill2");
    bl[i].ko = tr.querySelector(".ko").value; bl[i].skip = tr.querySelector(".skip").checked;
    s.fill = rgb(tr.querySelector(".fill").value);
    s.grad = f2 ? [rgb(tr.querySelector(".fill").value), rgb(f2.value)] : null;
    s.outline = tr.querySelector(".ol").checked ? rgb(tr.querySelector(".olc").value) : null;
    s.ow = +tr.querySelector(".ow").value; s.weight = +tr.querySelector(".wt").value;
    s.font = tr.querySelector(".fn").value || null;
    s.glow = tr.querySelector(".gl").checked ? rgb(tr.querySelector(".glc").value) : null;
    s.gs = +tr.querySelector(".gs").value / 100; s.ga = +tr.querySelector(".ga").value / 100;
    s.op = +tr.querySelector(".op").value / 100;
    s.scale = Math.min(5, Math.max(0.2, (+tr.querySelector(".sc").value || 100) / 100));
  }
  trs.forEach((tr, i) => {
    tr.addEventListener("change", () => { readRow(i); redraw(150); });
    tr.querySelector(".ko").addEventListener("keydown", e => { if (e.key === "Enter") { readRow(i); redraw(0); } });
    tr.querySelector(".sc").addEventListener("input", () => { readRow(i); redraw(500); });
    tr.querySelectorAll("input[type=range]").forEach(r => r.addEventListener("input", () => {
      if (r.classList.contains("gs") || r.classList.contains("ga")) tr.querySelector(".gl").checked = true;   // 광선 조절하면 자동으로 켬
      readRow(i); redraw(250); }));
    tr.querySelector(".rs").onclick = () => { const s = bl[i].style; s.dx = 0; s.dy = 0; s.scale = 1; tr.querySelector(".sc").value = 100; redraw(0); };
    tr.addEventListener("click", e => { if (e.target.tagName !== "SELECT") select(i); });
    tr.querySelectorAll(".eye").forEach(btn => btn.onclick = async ev => {
      ev.preventDefault();
      try {
        const r = await new EyeDropper().open();
        const inp = tr.querySelector("." + btn.dataset.for); inp.value = r.sRGBHex;
        if (btn.dataset.for === "olc") tr.querySelector(".ol").checked = true;
        if (btn.dataset.for === "glc") tr.querySelector(".gl").checked = true;
        const f2 = tr.querySelector(".fill2"); if (btn.dataset.for === "fill" && f2) f2.value = r.sRGBHex;   // 그라데이션이면 한 색으로
        readRow(i); redraw(0);
      } catch (e) {}
    });
  });
  const all = el.querySelector(".fnall");
  const fillFonts = () => {
    if (all) all.innerHTML = `<option value="-">— 골라서 한 번에 —</option><option value="">기본 고딕 (본고딕)</option><option value="@serif">기본 명조 (본명조)</option>` + FONTS.map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join("");
    trs.forEach((tr, i) => { const s = tr.querySelector(".fn"); if (document.activeElement !== s) s.innerHTML = fontOpts(bl[i].style.font); });
  };
  fillFonts(); fontWait.push(fillFonts);
  if (all) all.onchange = () => {
    if (all.value === "-") return;
    trs.forEach((tr, i) => { tr.querySelector(".fn").value = all.value; readRow(i); });
    all.value = "-"; redraw(0);
  };

  function redraw(wait) {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const my = ++seq;
      const blocks = bl.map(b => ({ ko: b.ko, skip: b.skip, ...b.style }));
      img.classList.add("busy");
      fetch(`/imgtr/edit/${cur}/${u}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ blocks }) })
        .then(r => r.json()).then(r => {
          if (my !== seq) return;
          (r.drawn || []).forEach((d, i) => { if (bl[i]) bl[i].drawn = d; });
          const pre = new Image();
          pre.onload = () => { if (my === seq) { img.src = pre.src; img.classList.remove("busy"); } };
          pre.src = `/imgtr/img/${cur}/out/${u}?t=${Date.now()}`;
        }).catch(() => img.classList.remove("busy"));
    }, wait);
  }
}
// 처음 준비 (모델 받기) 상태
function setupPoll() {
  fetch("/setup").then(r => r.json()).then(s => {
    if (s.running) { if (!cur) $("msg").textContent = "처음 준비 중 — " + s.msg; setTimeout(setupPoll, 2000); }
    else if (s.error && !cur) { $("msg").textContent = "준비 중 문제: " + s.error; $("msg").classList.add("bad"); }
    else if (!cur) $("msg").textContent = "준비됐어요. 이미지를 넣어 주세요.";
  }).catch(() => setTimeout(setupPoll, 3000));
}
setupPoll();
// 마지막 작업 다시 보기
try { const last = localStorage.getItem("imgtr_last"); if (last) { cur = last; poll(); } } catch (e) {}
</script>
