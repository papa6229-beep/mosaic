<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모자이크 생성기</title>
<style>
  :root{--bg:#f5f5f4;--card:#fff;--ink:#1c1917;--sub:#78716c;--line:#e7e5e4;--acc:#d97706;--ok:#15803d;--bad:#b91c1c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
  main{max-width:640px;margin:40px auto;padding:0 16px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  #drop{border:2px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;transition:.15s}
  #drop.on{border-color:var(--acc);background:#fffbeb}
  #drop b{display:block;font-size:16px;margin-bottom:4px}
  #fname{margin-top:8px;color:var(--acc);font-weight:600;word-break:break-all}
  label{display:block;font-size:13px;color:var(--sub);margin:14px 0 4px}
  input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .row{display:grid;grid-template-columns:1fr 60px;gap:10px;align-items:center}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .val{text-align:right;font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;color:var(--sub);font-size:14px}
  button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;margin-top:4px}
  button:disabled{opacity:.4;cursor:default}
  .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
  .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
  #msg{font-size:14px}
  .rep div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
  .good{color:var(--ok);font-weight:600}.warn{color:var(--bad);font-weight:600}
  a.dl{display:block;text-align:center;padding:14px;border-radius:10px;background:var(--ok);color:#fff;font-weight:600;text-decoration:none;margin-top:14px}
  .hide{display:none}
</style>
</head>
<body>
<main>
  <h1>모자이크 생성기</h1>
  <p class="sub">원본 모자이크 위에 더 크고 자연스러운 블러를 덮어요.</p>

  <div class="card">
    <div id="drop"><b>영상 파일을 여기에 끌어 놓거나 눌러서 선택</b><span class="sub">mp4 등</span><div id="fname"></div></div>
    <input id="file" type="file" accept="video/*" class="hide">
    <label>또는 파일 경로 붙여넣기 (큰 파일은 이쪽이 빨라요. 복사하지 않고 바로 읽음)</label>
    <input id="path" type="text" placeholder="예: D:\영상\원본.mp4">

    <label style="display:flex;gap:8px;align-items:center;margin-top:16px;color:var(--ink);font-size:14px">
      <input id="hair" type="checkbox" checked> 원본 모자이크 밖으로 나온 털까지 찾아서 같이 덮기
    </label>
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--ink);font-size:14px">
      <input id="subs" type="checkbox"> 말(일본어·영어)을 받아 적어서 한국어 자막도 만들기 (블러 작업과 같이 진행)
    </label>
    <label>털 찾는 범위 — 클수록 모자이크에서 멀리 떨어진 음모까지 잡아요 (최대 250픽셀)</label>
    <div class="row"><input id="reach" type="range" min="0.2" max="1" step="0.05" value="0.8"><span class="val" id="reach_v"></span></div>

    <details style="margin-top:16px">
      <summary>덮는 모양 조절 (보통은 그대로)</summary>
      <label>블러 크기 — 장면마다 가려야 할 곳 크기의 몇 배로 고정할지 (털이 나오면 올리고, 너무 크면 내리세요)</label>
      <div class="row"><input id="scale" type="range" min="0.8" max="2.5" step="0.05" value="0.8"><span class="val" id="scale_v"></span></div>
      <label>블러 세기</label>
      <div class="row"><input id="blur" type="range" min="0.1" max="0.6" step="0.05" value="0.2"><span class="val" id="blur_v"></span></div>
      <label>가장자리 번짐 폭 — 클수록 바깥으로 더 넓게 서서히 투명해져요 (최대 150픽셀)</label>
      <div class="row"><input id="feather" type="range" min="0.1" max="0.8" step="0.05" value="0.5"><span class="val" id="feather_v"></span></div>
    </details>
  </div>

  <button id="go">모자이크 만들기</button>

  <div class="card hide" id="prog" style="margin-top:16px">
    <div id="msg">준비 중</div>
    <div id="submsg" class="sub" style="margin-top:4px"></div>
    <div class="bar"><i id="bar"></i></div>
    <div id="result"></div>
  </div>
  <div class="card" id="jobsCard" style="display:none">
    <b>최근 작업 — 검수·수정하기</b>
    <div id="jobs" style="margin-top:8px;font-size:14px"></div>
  </div>
</main>
<script>
function loadJobs(){
  fetch("/jobs").then(r=>r.json()).then(js=>{
    if(!js.length)return;
    document.getElementById("jobsCard").style.display="";
    document.getElementById("jobs").innerHTML=js.map(j=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${j.name} <span style="color:var(--sub)">(${j.sec}초 · ${new Date(j.t*1000).toLocaleString()})</span></span><span><a href="/review/${j.jid}" target="_blank">블러 검수</a> · <a href="/review/${j.jid}/subtitles" target="_blank">자막</a></span></div>`).join("");
  }).catch(()=>{});
}
loadJobs();
const $=id=>document.getElementById(id);
let file=null;
["scale","blur","feather","reach"].forEach(k=>{const s=()=>$(k+"_v").textContent=$(k).value;$(k).oninput=s;s();});
$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>pick(e.target.files[0]);
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("on")};
$("drop").ondragleave=()=>$("drop").classList.remove("on");
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("on");pick(e.dataTransfer.files[0])};
function pick(f){file=f;$("fname").textContent=f?f.name+" ("+(f.size/1e9).toFixed(2)+" GB)":""}

$("go").onclick=()=>{
  const path=$("path").value.trim();
  if(!file&&!path){alert("영상을 고르거나 경로를 넣어 주세요");return}
  const fd=new FormData();
  if(path)fd.append("path",path);else fd.append("file",file);
  ["scale","blur","feather","reach"].forEach(k=>fd.append(k,$(k).value));
  fd.append("hair",$("hair").checked?"1":"0");
  fd.append("subs",$("subs").checked?"1":"0");
  $("go").disabled=true;$("prog").classList.remove("hide");$("result").innerHTML="";delete $("result").dataset.id;
  const x=new XMLHttpRequest();x.open("POST","/start");
  x.upload.onprogress=e=>{if(e.lengthComputable){$("msg").textContent="올리는 중 "+Math.round(e.loaded*100/e.total)+"%";}};
  x.onload=()=>{const r=JSON.parse(x.responseText);if(r.error){fail(r.error);return}poll(r.job)};
  x.onerror=()=>fail("업로드 실패");x.send(fd);
};
function fmt(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+"시간 ":"")+(m?m+"분 ":"")+x+"초"}
let started=0;
function fail(m){$("msg").innerHTML='<span class="warn">'+m+'</span>';$("go").disabled=false}
function poll(id){
  fetch("/status/"+id).then(r=>r.json()).then(s=>{
    if(!started)started=Date.now();
    $("msg").textContent=s.msg+(s.done?"":` · 지금까지 ${fmt((Date.now()-started)/1000)}`);$("bar").style.width=(s.pct||0)+"%";
    const sb=s.subs;                                       // 자막 진행 상황 (따로 한 줄)
    $("submsg").textContent=sb?("자막: "+(sb.sub_error?"실패 — "+sb.sub_error:sb.sub_msg)):"";
    if(s.error){fail(s.error);return}
    if(!s.done||(sb&&!sb.sub_done)){if(!s.done){setTimeout(()=>poll(id),700);return}setTimeout(()=>poll(id),1500)}
    if(!s.done)return;
    if($("result").dataset.id===id)return;
    $("result").dataset.id=id;
    const r=s.report;
    $("result").innerHTML=`<div class="rep">
      <div><span>전체 프레임</span><span>${r.frames}</span></div>
      <div><span>덮은 프레임</span><span>${r.covered}</span></div>
      <div><span>Lada가 놓친 프레임 (앞뒤로 채움)</span><span>${r.missing}</span></div>
      <div><span>털 비침 의심</span><span class="${r.leak?'warn':'good'}">${r.leak?r.leak+"프레임":"없음"}</span></div>
      ${r.leak?`<div><span>의심 위치(초)</span><span>${r.leak_times.join(", ")}</span></div>`:""}
      <div><span>영상 길이</span><span>${fmt(r.video_sec)}</span></div>
      <div><span>저장 형식 (원본과 같게)</span><span>${(r.out_fmt||"").replace(/</g,"&lt;")}</span></div>
      <div><span>1. 원본 모자이크 위치 찾기 (${(r.det_how||"").replace(/</g,"&lt;")}${r.nude_how?" · 얼굴·노출 "+r.nude_how:""})</span><span>${fmt(r.t_detect)}</span></div>
      ${r.times?`<div><span>2. 털·덮을 곳 훑기 (CPU ${r.workers||1}개)</span><span>${fmt(r.times.scan||0)}</span></div>
      <div><span>3. 블러 위치·크기 정하기</span><span>${fmt(r.times.plan||0)}</span></div>
      <div><span>4. 블러 그리고 저장 (CPU ${r.workers||1}개)</span><span>${fmt(r.times.paint||0)}</span></div>
      <div><span>5. 이어 붙이고 소리 붙이기</span><span>${fmt(r.times.mux||0)}</span></div>`:""}
      <div><span><b>전체 작업 시간</b></span><span><b>${fmt(r.sec)}</b> (영상 길이의 ${(r.sec/r.video_sec).toFixed(1)}배)</span></div>
      <div><span>1시간 영상이면 (예상)</span><span>${fmt(r.sec/r.video_sec*3600)}</span></div></div>
      <a class="dl" href="/download/${id}">결과 영상 받기 (${(r.out_name||"").replace(/</g,"&lt;")})</a>
      <a class="dl" style="background:#d97706" href="/review/${id}" target="_blank">검수·수정하기 (블러 직접 고치기)</a>
      ${sb?`<a class="dl" style="background:#0369a1" href="/review/${id}/subtitles" target="_blank">자막 보기·고치기 · 자막 파일(.srt) 받기</a>`:""}`;
    loadJobs();
    $("go").disabled=false;
  });
}
</script>
</body>
</html>
